<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .staff{fill:none;stroke:#2a2520;stroke-width:1.4;stroke-linecap:round;opacity:.9;}
      .note{fill:#2a2520;opacity:.92;}
      .clef{fill:#2a2520;opacity:.88;}
      @keyframes wave1{0%,100%{transform:translateY(0);}50%{transform:translateY(-2.5px);}}
      @keyframes wave2{0%,100%{transform:translateY(0);}50%{transform:translateY(1.8px);}}
      @keyframes wave3{0%,100%{transform:translateY(0);}50%{transform:translateY(-1.2px);}}
      @keyframes drift{0%{transform:translateX(0);}100%{transform:translateX(6px);}}
      .w1{animation:wave1 4.2s ease-in-out infinite;}
      .w2{animation:wave2 5.6s ease-in-out infinite;}
      .w3{animation:wave3 3.8s ease-in-out infinite;}
      .drift-slow{animation:drift 12s ease-in-out infinite alternate;}
    </style>
  </defs>

  <!-- 五线谱主干：5 条平行飘带 -->
  <g class="drift-slow">
    <path class="staff w1" d="M20,180 C120,120 250,240 380,160 C500,90 620,220 780,140"/>
    <path class="staff w2" d="M20,196 C120,136 250,256 380,176 C500,106 620,236 780,156"/>
    <path class="staff w3" d="M20,212 C120,152 250,272 380,192 C500,122 620,252 780,172"/>
    <path class="staff w2" d="M20,228 C120,168 250,288 380,208 C500,138 620,268 780,188"/>
    <path class="staff w1" d="M20,244 C120,184 250,304 380,224 C500,154 620,284 780,204"/>
  </g>

  <!-- 高音谱号 -->
  <g transform="translate(32, 188) scale(1.1)" class="w3">
    <text x="0" y="0" font-size="52" class="clef" font-family="serif">𝄞</text>
  </g>

  <!-- 音符组 1：左侧密集区 -->
  <g class="w2">
    <circle cx="95" cy="172" r="4.5" class="note"/>
    <line x1="95" y1="172" x2="95" y2="148" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="98" cy="148" rx="5" ry="3" transform="rotate(-20 98 148)" fill="#2a2520"/>

    <circle cx="125" cy="188" r="4.5" class="note"/>
    <line x1="125" y1="188" x2="125" y2="164" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="128" cy="164" rx="5" ry="3" transform="rotate(-20 128 164)" fill="#2a2520"/>

    <circle cx="152" cy="208" r="4" class="note"/>
    <line x1="152" y1="208" x2="152" y2="188" stroke="#2a2520" stroke-width="1"/>

    <circle cx="180" cy="198" r="4.5" class="note"/>
    <line x1="180" y1="198" x2="180" y2="174" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="183" cy="174" rx="5" ry="3" transform="rotate(-20 183 174)" fill="#2a2520"/>
  </g>

  <!-- 音符组 2：中段 -->
  <g class="w1">
    <circle cx="260" cy="178" r="4.5" class="note"/>
    <line x1="260" y1="178" x2="260" y2="154" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="263" cy="154" rx="5" ry="3" transform="rotate(-20 263 154)" fill="#2a2520"/>

    <circle cx="290" cy="162" r="4" class="note"/>
    <line x1="290" y1="162" x2="290" y2="142" stroke="#2a2520" stroke-width="1"/>

    <circle cx="330" cy="188" r="4.5" class="note"/>
    <line x1="330" y1="188" x2="330" y2="164" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="333" cy="164" rx="5" ry="3" transform="rotate(-20 333 164)" fill="#2a2520"/>

    <circle cx="365" cy="172" r="4" class="note"/>
    <line x1="365" y1="172" x2="365" y2="148" stroke="#2a2520" stroke-width="1"/>
  </g>

  <!-- 音符组 3：右侧上扬区 -->
  <g class="w3">
    <circle cx="450" cy="152" r="4.5" class="note"/>
    <line x1="450" y1="152" x2="450" y2="128" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="453" cy="128" rx="5" ry="3" transform="rotate(-20 453 128)" fill="#2a2520"/>

    <circle cx="485" cy="168" r="4" class="note"/>
    <line x1="485" y1="168" x2="485" y2="148" stroke="#2a2520" stroke-width="1"/>

    <circle cx="520" cy="142" r="4.5" class="note"/>
    <line x1="520" y1="142" x2="520" y2="118" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="523" cy="118" rx="5" ry="3" transform="rotate(-20 523 118)" fill="#2a2520"/>

    <circle cx="560" cy="158" r="4" class="note"/>
    <line x1="560" y1="158" x2="560" y2="138" stroke="#2a2520" stroke-width="1"/>

    <circle cx="600" cy="138" r="4.5" class="note"/>
    <line x1="600" y1="138" x2="600" y2="114" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="603" cy="114" rx="5" ry="3" transform="rotate(-20 603 114)" fill="#2a2520"/>
  </g>

  <!-- 音符组 4：最右尾端 -->
  <g class="w2">
    <circle cx="660" cy="162" r="4" class="note"/>
    <line x1="660" y1="162" x2="660" y2="142" stroke="#2a2520" stroke-width="1"/>

    <circle cx="700" cy="148" r="4.5" class="note"/>
    <line x1="700" y1="148" x2="700" y2="124" stroke="#2a2520" stroke-width="1.2"/>
    <ellipse cx="703" cy="124" rx="5" ry="3" transform="rotate(-20 703 124)" fill="#2a2520"/>

    <circle cx="740" cy="158" r="4" class="note"/>
    <line x1="740" y1="158" x2="740" y2="138" stroke="#2a2520" stroke-width="1"/>
  </g>

  <!-- 散落的十六分音符尾（连音线效果） -->
  <g class="w1" opacity=".7">
    <path d="M128,164 Q140,155 155,162" fill="none" stroke="#2a2520" stroke-width="1.2"/>
    <path d="M332,164 Q345,155 360,162" fill="none" stroke="#2a2520" stroke-width="1.2"/>
    <path d="M525,118 Q538,109 553,116" fill="none" stroke="#2a2520" stroke-width="1.2"/>
  </g>

  <!-- 升号/降号装饰 -->
  <g class="w3" opacity=".65">
    <text x="220" y="185" font-size="16" fill="#2a2520" font-family="serif">♯</text>
    <text x="410" y="155" font-size="14" fill="#2a2520" font-family="serif">♭</text>
    <text x="640" y="150" font-size="15" fill="#2a2520" font-family="serif">♯</text>
  </g>
</svg>
