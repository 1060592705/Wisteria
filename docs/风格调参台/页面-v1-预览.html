<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面预览 · Wisteria</title>
<style>
  @font-face{font-family:'SavoyeLet';src:url('../../参考资料/字体/savoyeletplain-01/savoyeletplain-01.ttf') format('truetype');font-display:swap;}
  @font-face{font-family:'ZhaoHua';src:url('../../参考资料/字体/朝华打字机_字库星球/朝华打字机_字库星球/朝華打字機/朝華打字機.ttf') format('truetype');font-display:swap;}

  :root{--paper:#F4F2F0;--deep-paper:#E8E5E1;--pink-main:#D4A5A5;--slate:#9BAAB8;--ink:#3D3535;--ink-soft:#8A8580;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#e7dfd0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);}

  /* 手机框 */
  .phone{width:362px;height:785px;background:var(--paper);border:12px solid #1a1a1a;border-radius:50px;overflow:hidden;box-shadow:0 14px 34px rgba(60,45,25,.22);position:relative;}
  .dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:26px;background:#1a1a1a;border-radius:13px;z-index:100;}
  .phone-in{height:100%;overflow:hidden;position:relative;background:var(--paper);}

  /* 首屏 */
  .diy-v2{position:relative;height:100%;}
  .diy-v2-art{position:absolute;left:-38px;top:0px;width:420px;z-index:1;background:#fff;mix-blend-mode:multiply;}
  .diy-v2-art img{width:100%;height:auto;display:block;border-radius:4px;}
  .diy-v2-logo{position:absolute;left:21px;top:128px;font-family:'SavoyeLet',cursive;font-size:42px;color:var(--ink);line-height:1.15;z-index:2;}
  .diy-v2-quote{position:absolute;left:19px;top:174px;font-family:'ZhaoHua','PingFang SC',sans-serif;font-size:10.5px;color:var(--ink-soft);line-height:1.6;z-index:2;}
  .diy-v2-todo{position:absolute;left:23px;top:218px;width:61px;font-family:ZhaoHua, "PingFang SC", sans-serif;font-size:13px;color:var(--ink);line-height:1.4;max-height:120px;overflow:hidden;z-index:2;}
  .diy-v2-todo .itm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .diy-v2-todo .chk{margin-right:9px;font-size:9px;}

  /* 月历 */
  .diy-v2-calendar{position:absolute;left:27px;top:453px;width:280px;}
  .diy-v2-calendar .folder-stack{position:relative;height:calc(223px + 40px);}
  .diy-v2-calendar .folder-sheet{position:absolute;width:100%;border-radius:17px;padding:20px 6px 12px;box-shadow:2px 4px 12px rgba(60,45,25,0.12);height:223px;}
  .diy-v2-calendar .sheet-1{top:0;left:0;background:#F5EEED;z-index:3;}
  .diy-v2-calendar .sheet-2{top:-7px;left:8px;background:#FAF8F5;z-index:2;}
  .diy-v2-calendar .sheet-3{top:-14px;left:16px;background:#d8dadf;z-index:1;}
  .diy-v2-calendar .folder-tab{position:absolute;top:-20px;padding:3px 0;width:100px;text-align:center;border-radius:10px 10px 0 0;font-family:'SavoyeLet',cursive;font-size:16.5px;color:var(--ink);line-height:1.2;}
  .diy-v2-calendar .sheet-1 .folder-tab{right:43px;background:#F5EEED;}
  .diy-v2-calendar .sheet-2 .folder-tab{right:30px;background:#FAF8F5;}
  .diy-v2-calendar .sheet-3 .folder-tab{right:20px;background:#d8dadf;}
  .diy-v2-calendar .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:9px;color:#8A8580;margin-bottom:10px;font-family:'ZhaoHua','PingFang SC',sans-serif;}
  .diy-v2-calendar .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0px;text-align:center;}
  .diy-v2-calendar .cal-cell{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .diy-v2-calendar .cal-circle{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:transparent;color:#8A8580;border:0px solid #E8E5E1;font-family:'SavoyeLet',cursive;box-sizing:border-box;}
  .diy-v2-calendar .cal-num{display:inline-block;transform:translate(0px,-1px);}
  .diy-v2-calendar .cal-circle.taken{background:#D4A5A5;color:#fff;border-color:#D4A5A5;}
  .diy-v2-calendar .cal-circle.today{box-shadow:0 0 0 1.5px var(--ink);}
</style>
</head>
<body>

<div class="phone">
  <div class="phone-in">
    <div class="dynamic-island"></div>
    <div class="diy-v2">
      <!-- 薰图 -->
      <div class="diy-v2-art">
        <img src="../../参考资料/图片/diy/5321dacad503ab32757077d67f6e4686.jpg" draggable="false" />
      </div>
      <!-- 标题 -->
      <div class="diy-v2-logo">Halu Kaolu</div>
      <!-- 引言 -->
      <div class="diy-v2-quote">我就是为了与你相遇<br>才出生于世的。</div>
      <!-- Todo -->
      <div class="diy-v2-todo">
        <div class="itm done"><span class="chk">□</span>喝水</div>
        <div class="itm done"><span class="chk">□</span>背单词</div>
        <div class="itm med"><span class="chk">□</span>吃药</div>
        <div class="itm"><span class="chk">□</span>早餐</div>
        <div class="itm"><span class="chk">□</span>开会</div>
        <div class="itm"><span class="chk">□</span>游泳</div>
        <div class="itm"><span class="chk">□</span>睡前记录</div>
      </div>
      <!-- 月历 -->
      <div class="diy-v2-calendar">
        <div class="folder-stack">
          <div class="folder-sheet sheet-3">
            <div class="folder-tab">October.</div>
            <div class="cal-weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
            <div class="cal-grid" id="grid3"></div>
          </div>
          <div class="folder-sheet sheet-2">
            <div class="folder-tab">September.</div>
            <div class="cal-weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
            <div class="cal-grid" id="grid2"></div>
          </div>
          <div class="folder-sheet sheet-1">
            <div class="folder-tab">August.</div>
            <div class="cal-weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
            <div class="cal-grid" id="grid1"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function renderMonth(year, month, takenDays, gridId) {
  const grid = document.getElementById(gridId);
  if(!grid) return;
  grid.innerHTML = '';
  const firstDay = new Date(year, month, 1).getDay();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  for(let i = 0; i < startOffset; i++) grid.innerHTML += '<div class="cal-cell"></div>';
  for(let d = 1; d <= daysInMonth; d++) {
    let cls = 'cal-circle';
    if(takenDays.includes(d)) cls += ' taken';
    if(gridId === 'grid1' && d === 21) cls += ' today';
    grid.innerHTML += `<div class="cal-cell"><div class="${cls}"><span class="cal-num">${d}</span></div></div>`;
  }
  const total = startOffset + daysInMonth;
  for(let i = 0; i < 42 - total; i++) grid.innerHTML += '<div class="cal-cell"></div>';
}

renderMonth(2026,7,[1,2,4,5,7,8,11,12,14,15,18,19,21],'grid1');
renderMonth(2026,8,[],'grid2');
renderMonth(2026,9,[],'grid3');
</script>

</body>
</html>
