<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月历调参台 · Wisteria</title>
<style>
  @font-face{font-family:'SavoyeLet';src:url('../../参考资料/字体/savoyeletplain-01/savoyeletplain-01.ttf') format('truetype');}
  @font-face{font-family:'ZhaoHua';src:url('../../参考资料/字体/朝华打字机_字库星球/朝华打字机_字库星球/朝華打字機/朝華打字機.ttf') format('truetype');}
  @font-face{font-family:'DTNightingale';src:url('../../参考资料/字体/DT Nightingale_字库星球/DT Nightingale/DTNightingale-Light.ttf') format('truetype');}
  @font-face{font-family:'Caramel';src:url('../../参考资料/字体/Caramel_字库星球/Caramel/Caramel-Regular.ttf') format('truetype');}
  @font-face{font-family:'Bentham';src:url('../../参考资料/字体/Bentham_字库星球/Bentham_字库星球/Bentham/Bentham-Regular.ttf') format('truetype');}
  @font-face{font-family:'Report1942';src:url('../../参考资料/字体/1942 Report_字库星球/1942 Report_字库星球/1942-report/1942.ttf') format('truetype');}

  :root{
    --paper:#F4F2F0;--deep-paper:#E8E5E1;--pink-main:#D4A5A5;--slate:#9BAAB8;--ink:#3D3535;--ink-soft:#8A8580;
    --sheet2-x:8px; --sheet2-y:-8px;
    --sheet3-x:16px; --sheet3-y:-16px;
    --sheet1-bg:#F5EEED; --sheet2-bg:#FAF8F5; --sheet3-bg:#E0DED8;
    --tab1-bg:#F5EEED; --tab2-bg:#FAF8F5; --tab3-bg:#E0DED8;
    --sheet-radius:12px;
    --shadow-alpha:0.12;
    --tab-y:-14px; --tab-size:14px;
    --tab1-right:100px; --tab2-right:60px; --tab3-right:20px;
    --tab-font:'SavoyeLet',cursive;
    --weekday-size:9px; --weekday-color:var(--ink-soft); --weekday-gap:8px;
    --weekday-font:'ZhaoHua','PingFang SC',sans-serif;
    --circle-size:34px; --circle-gap-x:2px; --circle-gap-y:5px;
    --circle-border:1px; --circle-border-color:var(--deep-paper);
    --circle-font-size:11px; --circle-font-color:var(--ink-soft);
    --circle-font:'ZhaoHua','PingFang SC',sans-serif;
    --taken-bg:var(--pink-main); --taken-color:#fff;
    --today-ring:1.5px;
    --stack-top:0px; --stack-x:0px;
    --cal-padding-x:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#e7dfd0;display:flex;height:100vh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);}

  /* Phone */
  .stage{display:flex;align-items:center;justify-content:center;flex:1;padding:20px;}
  .phone{width:362px;height:785px;background:var(--paper);border:12px solid #1a1a1a;border-radius:50px;overflow:hidden;box-shadow:0 14px 34px rgba(60,45,25,.22);flex-shrink:0;position:relative;}
  .dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:26px;background:#1a1a1a;border-radius:13px;z-index:100;}
  .cal-wrap{padding:28px var(--cal-padding-x) 16px;height:100%;overflow-y:auto;}

  /* Stack */
  .folder-stack{position:relative;height:420px;margin-top:var(--stack-top);margin-left:var(--stack-x);}
  .folder-sheet{position:absolute;width:100%;border-radius:var(--sheet-radius);padding:20px 6px 12px;box-shadow:2px 4px 12px rgba(60,45,25,var(--shadow-alpha));}
  .sheet-1{top:0;left:0;background:var(--sheet1-bg);z-index:3;}
  .sheet-2{top:var(--sheet2-y);left:var(--sheet2-x);background:var(--sheet2-bg);z-index:2;}
  .sheet-3{top:var(--sheet3-y);left:var(--sheet3-x);background:var(--sheet3-bg);z-index:1;}
  .folder-tab{position:absolute;top:var(--tab-y);padding:3px 14px;border-radius:10px 10px 0 0;font-family:var(--tab-font);font-size:var(--tab-size);color:var(--ink);line-height:1.2;}
  .sheet-1 .folder-tab{right:var(--tab1-right);background:var(--tab1-bg);}
  .sheet-2 .folder-tab{right:var(--tab2-right);background:var(--tab2-bg);}
  .sheet-3 .folder-tab{right:var(--tab3-right);background:var(--tab3-bg);}

  /* Weekday */
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:var(--weekday-size);color:var(--weekday-color);margin-bottom:var(--weekday-gap);letter-spacing:.3px;font-family:var(--weekday-font);}

  /* Grid */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--circle-gap-y) var(--circle-gap-x);text-align:center;}
  .cal-cell{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .cal-circle{width:var(--circle-size);height:var(--circle-size);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--circle-font-size);background:transparent;color:var(--circle-font-color);border:var(--circle-border) solid var(--circle-border-color);transition:transform .1s;font-family:var(--circle-font);box-sizing:border-box;}
  .cal-circle.taken{background:var(--taken-bg);color:var(--taken-color);border-color:var(--taken-bg);}
  .cal-circle.today{box-shadow:0 0 0 var(--today-ring) var(--ink);}

  /* Panel */
  #panel{width:280px;background:#37322a;color:#e8e2d6;padding:16px;overflow-y:auto;height:100vh;flex-shrink:0;font-size:12px;}
  #panel h2{font-size:16px;margin-bottom:4px;color:#f3ece0;}
  #panel .hint{font-size:11px;color:#b3a995;line-height:1.6;margin-bottom:14px;}
  .grp{margin-bottom:14px;border-bottom:1px solid #544d40;padding-bottom:12px;}
  .grp h3{font-size:12px;color:#d8cfbd;margin-bottom:8px;letter-spacing:1px;}
  .row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
  .row label{width:50px;color:#b3a995;font-size:10.5px;}
  .row input[type="number"]{width:52px;padding:3px 4px;border:none;border-radius:4px;background:#2b2721;color:#f0e9da;font-size:11px;}
  .row input[type="range"]{flex:1;accent-color:#e98694;}
  .row input[type="color"]{width:28px;height:20px;border:none;padding:0;background:none;cursor:pointer;}
  .row select{flex:1;padding:3px 4px;border:none;border-radius:4px;background:#2b2721;color:#f0e9da;font-size:11px;}
  .row span.val{font-family:monospace;font-size:10.5px;color:#f0e9da;min-width:28px;text-align:right;}
  .btns{display:flex;gap:4px;margin-top:6px;}
  .btns button{flex:1;padding:5px;border:none;border-radius:5px;background:#c74a4a;color:#fff;font-size:11px;cursor:pointer;}
  .btns button.sec{background:#544d40;}
  .codebox{background:#2b2721;border-radius:6px;padding:8px;font-family:monospace;font-size:9.5px;color:#d8cfbd;line-height:1.5;margin-top:8px;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow-y:auto;}
  .sync-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;color:#d8cfbd;}
  .sync-row input{margin:0;}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="cal-wrap">
      <div class="folder-stack">
        <div class="folder-sheet sheet-3" id="sheet3">
          <div class="folder-tab">October.</div>
          <div class="cal-weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
          <div class="cal-grid" id="grid3"></div>
        </div>
        <div class="folder-sheet sheet-2" id="sheet2">
          <div class="folder-tab">September.</div>
          <div class="cal-weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
          <div class="cal-grid" id="grid2"></div>
        </div>
        <div class="folder-sheet sheet-1" id="sheet1">
          <div class="folder-tab">August.</div>
          <div class="cal-weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
          <div class="cal-grid" id="grid1"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<aside id="panel">
  <h2>月历调参台</h2>
  <div class="hint">拖动滑块实时预览，调好后点「生成 CSS」。</div>

  <div class="grp">
    <h3>📁 层叠偏移</h3>
    <div class="row"><label>2层左</label><input type="range" id="s2x" min="0" max="30" value="8"><span class="val" id="s2xv">8</span></div>
    <div class="row"><label>2层上</label><input type="range" id="s2y" min="-30" max="0" value="-8"><span class="val" id="s2yv">-8</span></div>
    <div class="row"><label>3层左</label><input type="range" id="s3x" min="0" max="40" value="16"><span class="val" id="s3xv">16</span></div>
    <div class="row"><label>3层上</label><input type="range" id="s3y" min="-40" max="0" value="-16"><span class="val" id="s3yv">-16</span></div>
  </div>

  <div class="grp">
    <h3>🎨 页面颜色</h3>
    <div class="row"><label>1层底色</label><input type="color" id="c1" value="#F5EEED"></div>
    <div class="row"><label>2层底色</label><input type="color" id="c2" value="#FAF8F5"></div>
    <div class="row"><label>3层底色</label><input type="color" id="c3" value="#E0DED8"></div>
    <div class="sync-row"><input type="checkbox" id="tab-sync" checked><label for="tab-sync" style="width:auto;">Tab 跟随页面色</label></div>
  </div>

  <div class="grp">
    <h3>🏷 Tab 标签</h3>
    <div class="row"><label>字体</label><select id="tab-font"><option value="'SavoyeLet',cursive" selected>Savoye LET</option><option value="'DTNightingale',cursive">DT Nightingale</option><option value="'Caramel',cursive">Caramel</option><option value="'ZhaoHua','PingFang SC',sans-serif">朝华打字机</option><option value="'Bentham',serif">Bentham</option><option value="'Report1942',serif">1942 Report</option></select></div>
    <div class="row"><label>字大小</label><input type="range" id="ts" min="8" max="20" value="14" step="0.5"><span class="val" id="tsv">14</span></div>
    <div class="row"><label>垂直位</label><input type="range" id="ty" min="-30" max="0" value="-14"><span class="val" id="tyv">-14</span></div>
    <div class="row"><label>Tab1右</label><input type="range" id="t1r" min="20" max="200" value="100"><span class="val" id="t1rv">100</span></div>
    <div class="row"><label>Tab2右</label><input type="range" id="t2r" min="20" max="200" value="60"><span class="val" id="t2rv">60</span></div>
    <div class="row"><label>Tab3右</label><input type="range" id="t3r" min="20" max="200" value="20"><span class="val" id="t3rv">20</span></div>
  </div>

  <div class="grp">
    <h3>📅 星期栏</h3>
    <div class="row"><label>字体</label><select id="wk-font"><option value="'ZhaoHua','PingFang SC',sans-serif" selected>朝华打字机</option><option value="'PingFang SC','Microsoft YaHei',sans-serif">PingFang SC</option><option value="monospace">等宽</option><option value="'DTNightingale',cursive">DT Nightingale</option><option value="'SavoyeLet',cursive">Savoye LET</option></select></div>
    <div class="row"><label>字大小</label><input type="range" id="ws" min="7" max="16" value="9" step="0.5"><span class="val" id="wsv">9</span></div>
    <div class="row"><label>字色</label><input type="color" id="wc" value="#8A8580"></div>
    <div class="row"><label>下间距</label><input type="range" id="wg" min="0" max="20" value="8"><span class="val" id="wgv">8</span></div>
  </div>

  <div class="grp">
    <h3>⭕ 圆格样式</h3>
    <div class="row"><label>字体</label><select id="cir-font"><option value="'ZhaoHua','PingFang SC',sans-serif" selected>朝华打字机</option><option value="'PingFang SC','Microsoft YaHei',sans-serif">PingFang SC</option><option value="monospace">等宽</option><option value="'DTNightingale',cursive">DT Nightingale</option><option value="'SavoyeLet',cursive">Savoye LET</option></select></div>
    <div class="row"><label>直径</label><input type="range" id="cs" min="20" max="50" value="34"><span class="val" id="csv">34</span></div>
    <div class="row"><label>横间距</label><input type="range" id="cgx" min="0" max="15" value="2"><span class="val" id="cgxv">2</span></div>
    <div class="row"><label>纵间距</label><input type="range" id="cgy" min="0" max="15" value="5"><span class="val" id="cgyv">5</span></div>
    <div class="row"><label>边框粗</label><input type="range" id="cb" min="0" max="3" value="1" step="0.5"><span class="val" id="cbv">1</span></div>
    <div class="row"><label>边框色</label><input type="color" id="cbc" value="#E8E5E1"></div>
    <div class="row"><label>字大小</label><input type="range" id="cfs" min="8" max="18" value="11" step="0.5"><span class="val" id="cfsv">11</span></div>
    <div class="row"><label>字色</label><input type="color" id="cfc" value="#8A8580"></div>
  </div>

  <div class="grp">
    <h3>✅ 打卡状态</h3>
    <div class="row"><label>打卡底色</label><input type="color" id="tkbg" value="#D4A5A5"></div>
    <div class="row"><label>打卡字色</label><input type="color" id="tkc" value="#FFFFFF"></div>
    <div class="row"><label>今天高亮</label><input type="range" id="tdr" min="0" max="4" value="1.5" step="0.5"><span class="val" id="tdrv">1.5</span></div>
  </div>

  <div class="grp">
    <h3>🖼 阴影 & 圆角</h3>
    <div class="row"><label>页面圆角</label><input type="range" id="sr" min="0" max="24" value="12"><span class="val" id="srv">12</span></div>
    <div class="row"><label>阴影浓度</label><input type="range" id="sh" min="0" max="40" value="12"><span class="val" id="shv">12</span></div>
  </div>

  <div class="grp">
    <h3>📐 布局</h3>
    <div class="row"><label>整体 X</label><input type="range" id="sx" min="-50" max="50" value="0"><span class="val" id="sxv">0</span></div>
    <div class="row"><label>整体 Y</label><input type="range" id="st" min="-20" max="60" value="0"><span class="val" id="stv">0</span></div>
    <div class="row"><label>左右边距</label><input type="range" id="cp" min="0" max="30" value="14"><span class="val" id="cpv">14</span></div>
  </div>

  <div class="grp">
    <h3>📋 输出代码</h3>
    <div class="btns"><button class="sec" onclick="genCode()">生成 CSS</button><button onclick="copyCode()">复制</button></div>
    <div class="codebox" id="codeout">点击「生成 CSS」…</div>
  </div>
</aside>

<script>
const root = document.documentElement;
function setVar(name, value) { root.style.setProperty(name, value); }

/* 通用滑块绑定 */
function bind(id, varName, unit='', transform=v=>v) {
  const el = document.getElementById(id);
  const valEl = document.getElementById(id+'v');
  if(!el) return;
  el.addEventListener('input', () => {
    const v = transform(el.value);
    setVar(varName, v + unit);
    if(valEl) valEl.textContent = el.value;
  });
}

bind('s2x','--sheet2-x','px');
bind('s2y','--sheet2-y','px');
bind('s3x','--sheet3-x','px');
bind('s3y','--sheet3-y','px');
bind('ts','--tab-size','px');
bind('ty','--tab-y','px');
bind('t1r','--tab1-right','px');
bind('t2r','--tab2-right','px');
bind('t3r','--tab3-right','px');
bind('ws','--weekday-size','px');
bind('wg','--weekday-gap','px');
bind('cs','--circle-size','px');
bind('cgx','--circle-gap-x','px');
bind('cgy','--circle-gap-y','px');
bind('cb','--circle-border','px');
bind('cfs','--circle-font-size','px');
bind('sr','--sheet-radius','px');
bind('sx','--stack-x','px');
bind('st','--stack-top','px');
bind('cp','--cal-padding-x','px');

/* 阴影浓度：用 0-40 映射到 0-0.4 */
document.getElementById('sh').addEventListener('input', e => {
  const v = (parseFloat(e.target.value)/100).toFixed(3);
  setVar('--shadow-alpha', v);
  document.getElementById('shv').textContent = e.target.value;
});

/* 今天高亮 */
document.getElementById('tdr').addEventListener('input', e => {
  setVar('--today-ring', e.target.value+'px');
  document.getElementById('tdrv').textContent = e.target.value;
});

/* 颜色 */
['c1','c2','c3'].forEach((id,idx) => {
  const varName = '--sheet'+(idx+1)+'-bg';
  const tabVar = '--tab'+(idx+1)+'-bg';
  document.getElementById(id).addEventListener('input', e => {
    setVar(varName, e.target.value);
    if(document.getElementById('tab-sync').checked) setVar(tabVar, e.target.value);
  });
});
document.getElementById('tab-sync').addEventListener('change', e => {
  ['c1','c2','c3'].forEach((id,idx) => {
    const val = document.getElementById(id).value;
    setVar('--tab'+(idx+1)+'-bg', e.target.checked ? val : '');
  });
});

document.getElementById('wc').addEventListener('input', e => setVar('--weekday-color', e.target.value));
document.getElementById('cbc').addEventListener('input', e => setVar('--circle-border-color', e.target.value));
document.getElementById('cfc').addEventListener('input', e => setVar('--circle-font-color', e.target.value));
document.getElementById('tkbg').addEventListener('input', e => setVar('--taken-bg', e.target.value));
document.getElementById('tkc').addEventListener('input', e => setVar('--taken-color', e.target.value));

/* 字体 */
document.getElementById('tab-font').addEventListener('change', e => setVar('--tab-font', e.target.value));
document.getElementById('wk-font').addEventListener('change', e => setVar('--weekday-font', e.target.value));
document.getElementById('cir-font').addEventListener('change', e => setVar('--circle-font', e.target.value));

/* 渲染月份 */
function renderMonth(year, month, takenDays, gridId) {
  const grid = document.getElementById(gridId);
  if(!grid) return;
  grid.innerHTML = '';
  const firstDay = new Date(year, month, 1).getDay();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  for(let i = 0; i < startOffset; i++) grid.innerHTML += '<div class="cal-cell"></div>';
  for(let d = 1; d <= daysInMonth; d++) {
    let cls = 'cal-circle';
    if(takenDays.includes(d)) cls += ' taken';
    if(gridId === 'grid1' && d === 21) cls += ' today';
    grid.innerHTML += `<div class="cal-cell"><div class="${cls}">${d}</div></div>`;
  }
  const total = startOffset + daysInMonth;
  const target = total <= 35 ? 35 : 42;
  for(let i = 0; i < target - total; i++) grid.innerHTML += '<div class="cal-cell"></div>';
}

renderMonth(2026,7,[1,2,4,5,7,8,11,12,14,15,18,19,21],'grid1');
renderMonth(2026,8,[],'grid2');
renderMonth(2026,9,[],'grid3');

/* 生成代码 */
function genCode() {
  const s = getComputedStyle(root);
  const get = (v) => s.getPropertyValue(v).trim();
  const code = `/* 月历容器 */
.cal-wrap{padding:28px ${get('--cal-padding-x')} 16px;}

/* 三页堆叠 */
.folder-stack{position:relative;height:420px;margin-top:${get('--stack-top')};}
.folder-sheet{position:absolute;width:100%;border-radius:${get('--sheet-radius')};padding:20px 6px 12px;box-shadow:2px 4px 12px rgba(60,45,25,${get('--shadow-alpha')});}
.sheet-1{top:0;left:0;background:${get('--sheet1-bg')};z-index:3;}
.sheet-2{top:${get('--sheet2-y')};left:${get('--sheet2-x')};background:${get('--sheet2-bg')};z-index:2;}
.sheet-3{top:${get('--sheet3-y')};left:${get('--sheet3-x')};background:${get('--sheet3-bg')};z-index:1;}

/* Tab */
.folder-tab{position:absolute;top:${get('--tab-y')};padding:3px 14px;border-radius:10px 10px 0 0;font-family:${get('--tab-font')};font-size:${get('--tab-size')};color:var(--ink);line-height:1.2;}
.sheet-1 .folder-tab{right:${get('--tab1-right')};background:${get('--tab1-bg')};}
.sheet-2 .folder-tab{right:${get('--tab2-right')};background:${get('--tab2-bg')};}
.sheet-3 .folder-tab{right:${get('--tab3-right')};background:${get('--tab3-bg')};}

/* 星期 */
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:${get('--weekday-size')};color:${get('--weekday-color')};margin-bottom:${get('--weekday-gap')};font-family:${get('--weekday-font')};}

/* 圆格 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:${get('--circle-gap-y')} ${get('--circle-gap-x')};text-align:center;}
.cal-circle{width:${get('--circle-size')};height:${get('--circle-size')};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:${get('--circle-font-size')};color:${get('--circle-font-color')};border:${get('--circle-border')} solid ${get('--circle-border-color')};font-family:${get('--circle-font')};box-sizing:border-box;}
.cal-circle.taken{background:${get('--taken-bg')};color:${get('--taken-color')};border-color:${get('--taken-bg')};}
.cal-circle.today{box-shadow:0 0 0 ${get('--today-ring')} var(--ink);}`;
  document.getElementById('codeout').textContent = code;
}

function copyCode() {
  const t = document.getElementById('codeout').textContent;
  if(!t || t==='点击「生成 CSS」…') return;
  navigator.clipboard.writeText(t).then(() => alert('已复制到剪贴板'));
}
</script>
